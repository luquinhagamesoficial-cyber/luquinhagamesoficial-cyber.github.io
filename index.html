<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luquinha Games</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
background:#000;
overflow:hidden;
color:white;
}

/* Fundo animado */
body::before{
content:"";
position:absolute;
width:300%;
height:300%;
background:
radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
animation:space 80s linear infinite;
opacity:0.25;
}

@keyframes space{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-1200px);
}
}

.container{
position:relative;
z-index:2;
background:rgba(0,0,0,0.75);
padding:45px;
border-radius:25px;
text-align:center;
border:2px solid #00ffee;
box-shadow:
0 0 20px #00ffee,
0 0 40px #00ffee;
backdrop-filter:blur(8px);
width:90%;
max-width:500px;
}

.logo{
font-size:42px;
margin-bottom:10px;
}

h1{
font-size:38px;
margin-bottom:15px;
color:#00ffee;
text-shadow:0 0 15px #00ffee;
}

p{
margin-bottom:30px;
font-size:18px;
color:#ddd;
}

button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:14px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
color:white;
}

.pc{
background:linear-gradient(45deg,#00ff88,#00cc66);
}

.mobile{
background:linear-gradient(45deg,#0099ff,#00ccff);
}

.discord{
background:linear-gradient(45deg,#5865F2,#7289DA);
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px white;
}

.footer{
margin-top:20px;
font-size:14px;
color:#aaa;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">🎮</div>

<h1>Luquinha Games</h1>

<p>Escolha uma opção:</p>

<button class="pc" onclick="pc()">
💻 PC
</button>

<button class="mobile" onclick="mobile()">
📱 Celular
</button>

<button class="discord" onclick="discord()">
👥 Comunidade
</button>

<div class="footer">
Luquinha Games © 2026
</div>

</div>

<script>

function pc(){
window.location.href="https://luquinhagamesoficial-cyber.github.io/pc";
}

function mobile(){
window.location.href="https://luquinha835.github.io/luquinha-games2";
}

function discord(){
window.location.href="https://discord.com/channels/1503897362202890351/1503897362752471227";
}

</script>

</body>
</html>
